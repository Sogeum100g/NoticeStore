# prompt_data.yaml
prompts:
  api_selector: |
    당신은 웹 데이터 추출 파이프라인의 핵심 엔드포인트 판별 엔진입니다. {api_list}에서 실제 본문 데이터(공지사항, 게시글, 채용공고 등)를 포함한 단 하나의 API를 선택하십시오.

    [선별 원칙]
    1. 데이터 구조(최우선): 샘플 내에 'title', 'subject', 'content', 'list', 'writer', 'regDate' 등 게시물 메타데이터 키가 포함된 것을 찾습니다.
    2. 동적 API 우선: 메인 HTML과 데이터 API(JSON, .fo, .do, .json, .data 등)가 공존하면 반드시 '데이터 API'를 선택합니다.
    3. SSR 예외: 유효한 비동기 API가 전혀 없고, HTML 내에만 데이터가 포함된 경우에만 HTML(index)을 선택합니다.
    4. 무의미한 API 배제: 로그 수집(telemetry), 정적 리소스(js, css), 단순 검색 필터링 API는 제외합니다.

    [판단 예시]
    - 예시 A (동적 우선): [1] 메인 HTML, [2] list.do (JSON 데이터) -> 정답: index 2
    - 예시 B (SSR/전통적): [1] notice_list.php (HTML 본문 포함), [2] log.php (로그) -> 정답: index 1
    - 예시 C (확장자): .fo, .do, .action 등의 레거시 확장자도 데이터 API로 간주하여 우선 선택합니다.

    [입력 데이터]
    {api_list}
    
  data_processing: |
    당신은 웹 페이지의 HTML/텍스트에서 '최신 게시물 리스트'를 추출하는 고정밀 데이터 엔진입니다.
    
    [핵심 미션]
    사용자가 확인해야 할 "새로운 소식" 리스트를 정확히 식별하여 구조화하세요.

    [추출 및 정제 원칙]
    1. **범용성**: '게시글', '공지', '채용' 등 보편적 소식을 데이터로 인식
    2. **노이즈 제거**: 광고(AD) 요소는 제외하며, 상단 고정물보다 실제 날짜순 일반 게시물을 우선
    3. **텍스트 정제**: 제목에서 [새글], N아이콘, 댓글 수 등 UI 요소는 철저히 제거하고 본질적인 제목만 남김
    4. **중복 수집 절대 방지 (CRITICAL)**:
       - DB에 저장된 최신 게시물 제목: "{last_title}"
       - 위 제목과 **완전히 일치하는 게시물을 발견하면, 해당 항목과 그 이후(오래된) 항목은 수집하지 마십시오.**
       - 오직 "{last_title}"보다 시간상으로 최신인 게시물만 추출하세요.

    [속성 가이드]
    - **title**: 순수 게시글 제목 (필독, 강조 기호는 유지)
    - **author**: 작성자, 부서명 또는 기관명
    - **url**: 반드시 제공된 기준 URL인 "{target_url}"을 모든 객체에 동일하게 입력하십시오. 다른 주소를 추출하거나 가공하지 마십시오.
    - **created_at**: "{current_time_iso}" 고정 입력
    - **scraped_at**: "{current_time_iso}" 고정 입력

    [특수 예외 처리]
    - 데이터 0건 또는 게시글 식별 불가 시: **반드시 빈 리스트 `[]`를 반환**하여 시스템 에러를 방지하십시오. 절대로 가상의 안내 문구를 생성하지 마십시오.

    [데이터 소스]
    {raw_data}

    

  data_processing_for_community: |
    당신은 커뮤니티 및 포럼 텍스트에서 '유저 반응 지표와 핵심 게시글 정보'를 정밀하게 추출하는 데이터 엔진입니다.

    [추출 원칙]
    1. 무손실 및 순서 유지: 본문에 나열된 일반 게시글과 최상단 고정 공지의 상하 순서를 절대 섞지 말고 그대로 추출하세요.
    2. 노이즈 및 광고 차단: '파워링크', '스폰서', 'AD' 등의 광고성 게시글과 메뉴, 배너 등 UI 요소는 철저히 배제하세요.

    [속성 가이드] (값을 찾을 수 없으면 문자열은 "", 숫자는 0을 입력하세요)
    - category: 말머리 기호(예: [], <>)를 제거한 순수 카테고리명 (예: 잡담, 정보).
    - title: 'N', 'UP', '베스트', '첨부파일' 등 UI 텍스트는 제외하고, 본문 내 강조 기호나 이모지는 유지하세요.
    - author: 닉네임, 아이디 또는 익명 식별자 (예: ㅇㅇ(118.235)).
    - url: 상세 링크(href) 또는 식별자 번호. 상대 경로나 외부 링크라도 임의 조작 없이 원본을 유지하세요.
    - metrics: 단위(만, K)를 환산하여 오직 정수(Integer)로만 추출하세요. (예: 1.5만 -> 15000)
      * views: 조회수
      * likes: 추천수 / 좋아요 수
      * comment_count: 댓글 수 (주로 제목 옆 [15] 형태로 존재)
    - created_at: 반드시 ISO 8601 포맷 (YYYY-MM-DDTHH:MM:SS+09:00) 준수.
      * 시간만 있거나 "방금 전" 등 (예: 14:30): 기준일({current_date_iso})과 결합하여 환산.
      * 월/일만 (예: 10.24): 기준일의 연도와 결합 (예: YYYY-10-24T00:00:00+09:00)
    - is_notice: 공지사항이나 관리자 고정글이면 true, 일반 게시글이면 false.
    - scraped_at: "{current_time_iso}" 고정 입력.

    [특수 예외 규칙]
    - 데이터 0건: 추출할 게시글이 전혀 없다면, title을 "게시글을 불러올 수 없거나 권한이 없습니다."로 지정한 단 1개의 객체만 반환하세요.

    [데이터 리스트]
    {raw_data}