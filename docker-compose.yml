services:
  # 1. 통합 백엔드 API 서버
  api:
    build: .
    container_name: noticestore-api
    # ports:
      # - "127.0.0.1:8000:8000" # 외부 직접 접근 차단, 로컬호스트(Nginx 등)에서만 접근 허용
      # ports: 설정을 완전히 삭제합니다. 도커 내부에서만 통신하도록 격리합니다.
    env_file:
      - .env
    volumes:
      - .:/app  # 현재 경로의 코드를 컨테이너 /app에 동기화
    # --reload 옵션으로 코드 수정 시 Uvicorn이 자동 재시작함
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    environment:
      - TZ=Asia/Seoul  # 💡 추가: OS 레벨의 타임존 강제 지정
    depends_on:
      - db
      - redis

  # 2. 메시지 브로커
  redis:
    image: redis:7-alpine
    container_name: noticestore_redis
    restart: always
    environment:
      - TZ=Asia/Seoul  # 💡 추가: OS 레벨의 타임존 강제 지정
    # ports:
    # - "6379:6379" 
    # ports 설정 삭제: 도커 내부 네트워크를 통해서만 접근 가능하도록 격리


  # 3. 크롤링 전용 Celery 워커
  crawler_worker:
    build: .
    container_name: noticestore_crawler_worker
    restart: always
    volumes:
      - .:/app
    # Playwright 작업의 자원 독점을 막기 위해 동시성과 prefetch를 제한합니다.
    command: celery -A celery_app worker --loglevel=info --queues=crawl --concurrency=2 --prefetch-multiplier=1
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 4. 알림 전용 Celery 워커
  notification_worker:
    build: .
    container_name: noticestore_notification_worker
    restart: always
    volumes:
      - .:/app
    command: celery -A celery_app worker --loglevel=info --queues=notification --concurrency=2
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 5. Celery 비트
  celery_beat:
    build: .
    container_name: noticestore_celery_beat
    restart: always
    volumes:
      - .:/app  # 스케줄러 코드도 실시간 동기화
    # 💡 수정: 스케줄 DB를 /tmp 에 생성하도록 하여 기존 오염된 파일의 영향을 받지 않도록 격리
    command: celery -A celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - TZ=Asia/Seoul  # 💡 필수 추가 2: OS 타임존 설정
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 6. 데이터베이스
  db:
    image: postgres:15
    container_name: noticestore-db
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul  # 💡 추가: OS 레벨의 타임존 강제 지정
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # ports:
    #   - "5432:5432"
    # ports 설정 삭제: 보안을 위해 외부 노출 완벽 차단
    # 수정 부분: 127.0.0.1을 붙여서 서버 외부(인터넷)에서는 못 들어오게 막고, 
    # SSH 터널링을 통한 로컬 접속만 허용합니다.
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  # 7. 리버스 프록시 (새로 추가)
  nginx:
    image: nginx:latest
    container_name: noticestore-nginx
    ports:
      - "80:80" # 외부의 80번 트래픽을 Nginx가 받습니다.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # 위에서 만든 설정 파일 덮어쓰기
    depends_on:
      - api # API 서버가 켜진 후 Nginx가 실행되도록 보장
    environment:
      - TZ=Asia/Seoul  # 💡 추가: OS 레벨의 타임존 강제 지정

volumes:
  postgres_data:
