# 1. HTTP (80): 인증서 갱신용 ACME 챌린지만 처리하고, 나머지는 전부 HTTPS로 리다이렉트
server {
    listen 80;
    server_name 158.180.71.94.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443): 실제 API 프록시
server {
    listen 443 ssl;
    server_name 158.180.71.94.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/158.180.71.94.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/158.180.71.94.sslip.io/privkey.pem;

    # Docker 내장 DNS를 사용해 API 컨테이너가 재생성되어도 새 IP를 다시 조회합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    location / {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
